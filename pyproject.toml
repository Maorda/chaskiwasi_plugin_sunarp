[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "chaskiwasi-plugin-sunarp"
version = "0.1.0"
description = "Plugin de enriquecimiento Sunarp para Chaskiwasi (Partidas Registrales)."
requires-python = ">=3.10"
dependencies = [
    "chaskiwasi>=0.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chaskiwasi_plugin_sunarp"]

[project.entry-points."chaskiwasi.plugins"]
sunarp = "chaskiwasi_plugin_sunarp.config:SunarpConfig"